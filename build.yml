name: Bangun APK Volume Melayang

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tulis proyek Android
        run: |
          set -e
          mkdir -p app/src/main/java/com/volumemelayang/app app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VolumeMelayang"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.volumemelayang.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.volumemelayang.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:label="Volume Melayang"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_volume_controls" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1A73E8"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,44h14l18,-14v48l-18,-14h-14z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M70,40c6,6 6,22 0,28l-4,-4c4,-5 4,-15 0,-20z" />
          </vector>
          EOF

          cat > app/src/main/java/com/volumemelayang/app/VolumeSliders.java <<'EOF'
          package com.volumemelayang.app;

          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          public class VolumeSliders extends LinearLayout {
              private static final int GREEN = 0xFF3DBA8C;

              private final AudioManager am;
              private final int[] streams = {
                      AudioManager.STREAM_RING, AudioManager.STREAM_MUSIC, AudioManager.STREAM_ALARM};
              private final String[] labels = {"Volume Dering", "Volume Media", "Volume Alarm"};
              private final int[] icons = {R.drawable.ic_bell, R.drawable.ic_music, R.drawable.ic_alarm};
              private final SeekBar[] bars = new SeekBar[3];
              private boolean warned;

              public VolumeSliders(Context context) {
                  super(context);
                  am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                  setOrientation(VERTICAL);
                  for (int i = 0; i < 3; i++) {
                      if (i > 0) {
                          View line = new View(context);
                          line.setBackgroundColor(0xFFEEEEEE);
                          addView(line, new LayoutParams(LayoutParams.MATCH_PARENT, dp(1)));
                      }
                      addView(buildRow(i));
                  }
                  refresh();
              }

              private View buildRow(final int i) {
                  Context c = getContext();

                  LinearLayout row = new LinearLayout(c);
                  row.setOrientation(VERTICAL);
                  row.setPadding(dp(16), dp(14), dp(16), dp(10));

                  TextView label = new TextView(c);
                  label.setText(labels[i]);
                  label.setTextSize(16);
                  label.setTextColor(0xFF666666);
                  label.setPadding(dp(32), 0, 0, 0);
                  row.addView(label);

                  LinearLayout line = new LinearLayout(c);
                  line.setOrientation(HORIZONTAL);
                  line.setGravity(Gravity.CENTER_VERTICAL);

                  ImageView small = new ImageView(c);
                  small.setImageResource(icons[i]);
                  line.addView(small, new LayoutParams(dp(20), dp(20)));

                  SeekBar seek = new SeekBar(c);
                  seek.setSplitTrack(false);
                  seek.setProgressTintList(ColorStateList.valueOf(GREEN));
                  seek.setProgressBackgroundTintList(ColorStateList.valueOf(0xFFCCCCCC));
                  GradientDrawable thumb = new GradientDrawable();
                  thumb.setShape(GradientDrawable.OVAL);
                  thumb.setColor(Color.WHITE);
                  thumb.setStroke(dp(1), 0xFFDDDDDD);
                  thumb.setSize(dp(24), dp(24));
                  seek.setThumb(thumb);
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          if (!fromUser) {
                              return;
                          }
                          try {
                              am.setStreamVolume(streams[i], progress, 0);
                          } catch (SecurityException e) {
                              if (!warned) {
                                  warned = true;
                                  Toast.makeText(getContext(),
                                          "Dering butuh izin Jangan Ganggu. Buka aplikasi Volume Melayang.",
                                          Toast.LENGTH_LONG).show();
                              }
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                          warned = false;
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                          refresh();
                      }
                  });
                  line.addView(seek, new LayoutParams(0, dp(48), 1f));

                  ImageView big = new ImageView(c);
                  big.setImageResource(icons[i]);
                  line.addView(big, new LayoutParams(dp(28), dp(28)));

                  row.addView(line);
                  bars[i] = seek;
                  return row;
              }

              public void refresh() {
                  for (int i = 0; i < 3; i++) {
                      bars[i].setMax(am.getStreamMaxVolume(streams[i]));
                      bars[i].setProgress(am.getStreamVolume(streams[i]));
                  }
              }

              @Override
              protected void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  refresh();
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_bell.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
